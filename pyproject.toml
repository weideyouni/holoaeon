[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holoaeon"
# 版本号只有一个权威来源：holoaeon/spec.py 的 VERSION（字面量赋值，setuptools 静态读取，
# 构建时不 import 包）。此处不再写死数字，避免安装元数据与代码各说一套。
dynamic = ["version"]
description = "HoloAeon: a dependency-free, deterministic, local-first kernel for weaving multi-agent systems from a logical matrix and an adaptive collaboration graph."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "weideyouni" }]
keywords = [
    "multi-agent",
    "agents",
    "agent-framework",
    "agent-matrix",
    "orchestration",
    "deterministic",
    "local-first",
    "offline",
    "vsa",
    "hyperdimensional-computing",
    "graph",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
# The runtime itself is dependency-free. These are only used by optional examples.
examples = []

[project.urls]
Homepage = "https://github.com/weideyouni/holoaeon"
Repository = "https://github.com/weideyouni/holoaeon"
Issues = "https://github.com/weideyouni/holoaeon/issues"
Documentation = "https://github.com/weideyouni/holoaeon/tree/main/docs"

[project.scripts]
holoaeon-demo = "holoaeon.demo_product:main"
holoaeon-bridge = "holoaeon.frontend_adapter:main"
holoaeon-os = "holoaeon.butler_os:main"
holoaeon-quartet = "holoaeon.packs.quartet_director_pack:main"
holoaeon-mcp = "holoaeon.mcp_adapter:main"
holoaeon-explore = "holoaeon.vector_sea_explorer:main"
holoaeon-lathe = "holoaeon.skill_lathe:main"

[tool.setuptools.dynamic]
version = {attr = "holoaeon.spec.VERSION"}

[tool.setuptools.packages.find]
include = ["holoaeon*"]

[tool.setuptools.package-data]
holoaeon = ["py.typed"]

