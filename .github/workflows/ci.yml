name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · tests+selftest+redline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 必须钉在 ubuntu-22.04：ubuntu-latest 已滚到 26.04，
        # 该镜像的预编译 Python 清单里没有 3.8，setup-python 会直接报
        # "The version '3.8' with architecture 'x64' was not found"。
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
    steps:
      # v5 / v6 起 action 本体跑在 Node 24 上，消掉 "Node.js 20 is deprecated" 警告。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Interpreter
        run: python -VV

      - name: Unit tests
        # 失败时把断言明细写进 annotation：未登录也能看到，不用点进日志。
        run: |
          set +e
          log=/tmp/tests.log
          python -m unittest discover -s tests -v > "$log" 2>&1
          rc=$?
          tail -n 40 "$log"
          if [ $rc -ne 0 ]; then
            detail=$(grep -E "FAIL:|ERROR:|Traceback|AssertionError|Ran |FAILED" "$log" | head -n 6 | tr '\n' ' ')
            echo "::error title=unit-tests rc=$rc py=${{ matrix.python }}::${detail:-no-detail}"
          fi
          exit $rc

      - name: Self-test (all groups)
        # 同上：断言红要把「哪一组失败」直接抛到 annotation。
        run: |
          set +e
          log=/tmp/selftest.log
          python -c "from holoaeon.selftest import run_all; r=run_all(); print('passed=%s/%s' % (r['passed'], r['groups'])); assert r['ok'] and r['failed']==0" > "$log" 2>&1
          rc=$?
          tail -n 40 "$log"
          if [ $rc -ne 0 ]; then
            detail=$(grep -E "FAIL|Traceback|AssertionError|passed=" "$log" | head -n 6 | tr '\n' ' ')
            echo "::error title=selftest rc=$rc py=${{ matrix.python }}::${detail:-no-detail}"
          fi
          exit $rc

      - name: Red-line scan (network / dependency / dangerous calls)
        # 失败时把扫描明细写进 annotation：未登录也能看到，不用点进日志。
        run: |
          set +e
          log=/tmp/redline.log
          python scripts/redline_scan.py > "$log" 2>&1
          rc=$?
          cat "$log"
          if [ $rc -ne 0 ]; then
            detail=$(grep -E "^  \[|Traceback|Error" "$log" | head -n 4 | tr '\n' ' ')
            echo "::error title=redline rc=$rc py=${{ matrix.python }}::${detail:-no-detail}"
          fi
          exit $rc

      - name: NEPHRON A1 verdict (off-vs-full byte identity + mutation proof)
        # A1 是断言项：判定必须 PASS，且篡改必须 FAIL，否则本步红。
        # A2 只是披露项，此处只跑 --runs 3 取中位数打印，不设阈值、不阻塞。
        run: |
          set +e
          log=/tmp/a1.log
          python scripts/measure_a1_a2.py --runs 3 > "$log" 2>&1
          rc=$?
          tail -n 30 "$log"
          if [ $rc -ne 0 ]; then
            detail=$(grep -E "A1|A2|Traceback|AssertionError" "$log" | head -n 6 | tr '\n' ' ')
            echo "::error title=nephron-a1 rc=$rc py=${{ matrix.python }}::${detail:-no-detail}"
          fi
          exit $rc

      - name: Examples 01-04 (smoke)
        run: |
          for f in examples/01_basic_matrix.py examples/02_semantic_routing.py \
                   examples/03_hebbian_collaboration.py examples/04_domain_pipeline.py; do
            echo "== $f"; python "$f"
          done
