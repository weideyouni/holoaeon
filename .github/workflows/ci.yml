name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · tests+selftest+redline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 必须钉在 ubuntu-22.04：ubuntu-latest 已滚到 26.04，
        # 该镜像的预编译 Python 清单里没有 3.8，setup-python 会直接报
        # "The version '3.8' with architecture 'x64' was not found"。
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Interpreter
        run: python -VV

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-test (all groups)
        run: |
          python -c "from holoaeon.selftest import run_all; r=run_all(); print('passed=%s/%s' % (r['passed'], r['groups'])); assert r['ok'] and r['failed']==0"

      - name: Red-line scan (network / dependency / dangerous calls)
        run: python scripts/redline_scan.py

      - name: NEPHRON A1 verdict (off-vs-full byte identity + mutation proof)
        # A1 是断言项：判定必须 PASS，且篡改必须 FAIL，否则本步红。
        # A2 只是披露项，此处只跑 --runs 3 取中位数打印，不设阈值、不阻塞。
        run: python scripts/measure_a1_a2.py --runs 3

      - name: Examples 01-04 (smoke)
        run: |
          for f in examples/01_basic_matrix.py examples/02_semantic_routing.py \
                   examples/03_hebbian_collaboration.py examples/04_domain_pipeline.py; do
            echo "== $f"; python "$f"
          done
